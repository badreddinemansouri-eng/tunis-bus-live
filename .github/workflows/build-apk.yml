name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js icons privacy.html terms.html capacitor.config.json package.json www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      # ----- FULL ICON OVERRIDE -----
      - name: Remove old Android icons
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable-*

      - name: Copy custom icon to all Android densities
        run: |
          # Create all density folders
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          # Copy icon to all densities (use the same 512px icon – Android will downscale)
          cp icons/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Copy same for round icon
          cp icons/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Create adaptive icon XML (Android 8+)
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      # ------------------------------------------

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
