name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js icons privacy.html terms.html capacitor.config.json package.json www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      # ----- MANUAL ICON COPY (GUARANTEED) -----
      - name: Copy custom icon to all Android densities
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icons/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # Also copy for round icon (if needed)
          cp icons/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
      # ------------------------------------------

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
