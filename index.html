<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚌 Tunis Bus Live</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#0d2b45">
  <meta name="description" content="Real‑time bus tracking for Tunis – live locations, route maps, and ETA predictions.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-top">
        <h1><i class="fas fa-bus"></i> Tunis Bus Live</h1>
        <span id="connectionStatus" class="connection-badge">Connecting...</span>
      </div>
      <nav class="tabs">
        <button id="tabDriver" class="tab-btn active"><i class="fas fa-steering-wheel"></i> Driver</button>
        <button id="tabPassenger" class="tab-btn"><i class="fas fa-person-waiting"></i> Passenger</button>
      </nav>
    </header>

    <!-- DRIVER VIEW -->
    <section id="driverView" class="view active">
      <div class="card driver-card">
        <h2><i class="fas fa-user"></i> Driver Panel</h2>
        <label for="driverName">Your Name</label>
        <input type="text" id="driverName" placeholder="e.g., Ahmed" autocomplete="name">
        <div class="search-input" style="margin-top:8px;">
          <i class="fas fa-magnifying-glass"></i>
          <input type="text" id="driverSearchInput" placeholder="Search route...">
        </div>
        <div class="two-col">
          <div>
            <label for="routeSelect">Route</label>
            <select id="routeSelect"><option value="">-- Choose --</option></select>
          </div>
          <div>
            <label for="directionSelect">Direction</label>
            <select id="directionSelect">
              <option value="forward">Forward</option>
              <option value="backward">Backward</option>
            </select>
          </div>
        </div>
        <button id="btnStartTrip" class="btn btn-primary"><i class="fas fa-play"></i> Start Trip</button>
        <button id="btnStopTrip" class="btn btn-danger hidden"><i class="fas fa-stop"></i> Stop Trip</button>
        <div id="driverStatus" class="status-box">Ready</div>
      </div>
    </section>

    <!-- PASSENGER VIEW -->
    <section id="passengerView" class="view">
      <div class="card search-card">
        <h2><i class="fas fa-search"></i> Find Your Bus</h2>
        <div class="search-row">
          <div class="search-input">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search route or stop...">
          </div>
          <button id="btnClearSearch" class="btn btn-secondary" style="width:auto;padding:12px 16px;"><i class="fas fa-times"></i></button>
        </div>
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div id="map"></div>
      <div class="card bus-list-card">
        <h3><i class="fas fa-list"></i> Active Buses <span style="font-size:0.7rem;font-weight:400;color:var(--text-light);" id="busCount"></span></h3>
        <ul id="busList"></ul>
        <div id="noBuses" class="empty-state"><i class="fas fa-bus-simple"></i><p>No active buses right now.</p></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
          <button id="favoriteBtn" class="btn btn-outline" style="width:auto;padding:8px 16px;"><i class="far fa-star"></i> Favorite</button>
          <button id="historyBtn" class="btn btn-outline" style="width:auto;padding:8px 16px;"><i class="fas fa-history"></i> History</button>
        </div>
      </div>
      <div id="routeDetailPanel" class="card route-detail hidden">
        <h3><i class="fas fa-route"></i> Route Details</h3>
        <div id="routeDetailContent"></div>
        <button id="btnCloseDetail" class="btn btn-secondary" style="width:auto;margin-top:10px;padding:8px 16px;"><i class="fas fa-times"></i> Close</button>
      </div>
    </section>

    <!-- HISTORY PANEL -->
    <div id="historyPanel" class="history-panel hidden">
      <h3><i class="fas fa-history"></i> Trip History</h3>
      <div id="historyList"></div>
      <button id="btnCloseHistory" class="btn btn-secondary" style="width:auto;margin-top:12px;padding:8px 16px;"><i class="fas fa-times"></i> Close</button>
    </div>
  </div>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="js/firebase-config.js?v=4"></script>
  <script src="js/routes.js?v=4"></script>
  <script type="module" src="js/app.js?v=4"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ Service Worker registered'))
          .catch(err => console.warn('❌ SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
