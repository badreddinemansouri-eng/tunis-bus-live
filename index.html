<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tunis Bus Live</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=16">

    <!-- Eruda: mobile console (remove in production if you want) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-top">
                <h1><i class="fas fa-bus"></i> Tunis Bus Live</h1>
                <span id="connectionStatus" class="connection-badge">Connecting...</span>
            </div>
            <nav class="tabs">
                <button id="tabDriver" class="tab-btn active"><i class="fas fa-steering-wheel"></i> Driver</button>
                <button id="tabPassenger" class="tab-btn"><i class="fas fa-person-waiting"></i> Passenger</button>
            </nav>
        </header>

        <!-- ========== DRIVER VIEW ========== -->
        <section id="driverView" class="view active">
            <div class="card driver-card">
                <h2><i class="fas fa-user"></i> Driver Panel</h2>
                <label for="driverName">Your Name (optional)</label>
                <input type="text" id="driverName" placeholder="e.g., Ahmed" autocomplete="name">

                <!-- Driver search input – filters the dropdown -->
                <div class="search-input" style="margin-top:8px;">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="text" id="driverSearchInput" placeholder="Search route..." autocomplete="off">
                </div>

                <div class="two-col">
                    <div>
                        <label for="routeSelect">Select Route</label>
                        <select id="routeSelect"><option value="">-- Choose Route --</option></select>
                    </div>
                    <div>
                        <label for="directionSelect">Direction</label>
                        <select id="directionSelect">
                            <option value="forward">Forward</option>
                            <option value="backward">Backward</option>
                        </select>
                    </div>
                </div>
                <button id="btnStartTrip" class="btn btn-primary btn-block"><i class="fas fa-play"></i> Start Trip & Share</button>
                <button id="btnStopTrip" class="btn btn-danger btn-block hidden"><i class="fas fa-stop"></i> Stop Trip</button>
                <div id="driverStatus" class="status-box"></div>
            </div>
        </section>

        <!-- ========== PASSENGER VIEW ========== -->
        <section id="passengerView" class="view">
            <div class="card search-card">
                <h2><i class="fas fa-search"></i> Find Your Bus or Stop</h2>
                <div class="search-row">
                    <div class="search-input">
                        <i class="fas fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search route or stop name..." autocomplete="off">
                    </div>
                    <button id="btnClearSearch" class="btn btn-secondary" style="width:auto; padding:12px 18px;"><i class="fas fa-times"></i></button>
                </div>
                <div id="searchResults" class="search-results hidden"></div>
                <div class="search-filter">
                    <label><input type="checkbox" id="chkRoutes" checked> Routes</label>
                    <label><input type="checkbox" id="chkStops" checked> Stops</label>
                </div>
            </div>
            <div id="map"></div>
            <div class="card bus-list-card">
                <h3><i class="fas fa-list"></i> Active Buses</h3>
                <ul id="busList"></ul>
                <div id="noBuses" class="empty-state"><i class="fas fa-bus-simple"></i><p>No active buses right now.</p></div>
            </div>
            <div id="routeDetailPanel" class="card route-detail hidden">
                <h3><i class="fas fa-route"></i> Route Details</h3>
                <div id="routeDetailContent"></div>
                <button id="btnCloseDetail" class="btn btn-secondary" style="width:auto; margin-top:10px;"><i class="fas fa-times"></i> Close</button>
            </div>
        </section>
    </div>

    <!-- Leaflet.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Our scripts (versioned to bust cache) -->
    <script src="js/firebase-config.js?v=16"></script>
    <script src="js/routes.js?v=16"></script>
    <script src="js/app.js?v=16"></script>
</body>
</html>
