<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚌 Tunis Bus Live</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#0d2b45">
  <meta name="description" content="Real‑time bus tracking for Tunis – live locations, route maps, and ETA predictions.">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Marker Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css?v=7">
  <!-- Capacitor bridge -->
  <script src="https://unpkg.com/@capacitor/core@latest/dist/capacitor.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-top">
        <h1><i class="fas fa-bus"></i> <span id="appTitle">Tunis Bus Live</span></h1>
        <div style="display:flex;align-items:center;gap:8px;">
          <select id="langSwitcher" style="background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:4px 12px;font-size:0.8rem;">
            <option value="en">EN</option>
            <option value="fr">FR</option>
            <option value="ar">عربي</option>
          </select>
          <span id="connectionStatus" class="connection-badge">Connecting...</span>
        </div>
      </div>
      <nav class="tabs">
        <button id="tabDriver" class="tab-btn active"><i class="fas fa-steering-wheel"></i> <span data-i18n="driver">Driver</span></button>
        <button id="tabPassenger" class="tab-btn"><i class="fas fa-person-waiting"></i> <span data-i18n="passenger">Passenger</span></button>
      </nav>
    </header>

    <!-- DRIVER VIEW -->
    <section id="driverView" class="view active">
      <div class="card driver-card">
        <h2><i class="fas fa-user"></i> <span data-i18n="driverPanel">Driver Panel</span></h2>
        <label for="driverName" data-i18n="yourName">Your Name</label>
        <input type="text" id="driverName" placeholder="e.g., Ahmed" autocomplete="name">
        <div class="search-input" style="margin-top:8px;">
          <i class="fas fa-magnifying-glass"></i>
          <input type="text" id="driverSearchInput" placeholder="Search route...">
        </div>
        <div class="two-col">
          <div>
            <label for="routeSelect" data-i18n="route">Route</label>
            <select id="routeSelect"><option value="">-- Choose --</option></select>
          </div>
          <div>
            <label for="directionSelect" data-i18n="direction">Direction</label>
            <select id="directionSelect">
              <option value="forward">Forward</option>
              <option value="backward">Backward</option>
            </select>
          </div>
        </div>
        <button id="btnStartTrip" class="btn btn-primary"><i class="fas fa-play"></i> <span data-i18n="startTrip">Start Trip</span></button>
        <button id="btnStopTrip" class="btn btn-danger hidden"><i class="fas fa-stop"></i> <span data-i18n="stopTrip">Stop Trip</span></button>
        <div id="driverStatus" class="status-box">Ready</div>
      </div>
    </section>

    <!-- PASSENGER VIEW -->
    <section id="passengerView" class="view">
      <div class="card search-card">
        <h2><i class="fas fa-search"></i> <span data-i18n="findBus">Find Your Bus</span></h2>
        <div class="search-row">
          <div class="search-input">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search route or stop...">
          </div>
          <button id="btnClearSearch" class="btn btn-secondary" style="width:auto;padding:12px 16px;"><i class="fas fa-times"></i></button>
        </div>
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div id="map"></div>
      <div class="card bus-list-card">
        <h3><i class="fas fa-list"></i> <span data-i18n="activeBuses">Active Buses</span> <span style="font-size:0.7rem;font-weight:400;color:var(--text-light);" id="busCount"></span></h3>
        <ul id="busList"></ul>
        <div id="noBuses" class="empty-state"><i class="fas fa-bus-simple"></i><p data-i18n="noBuses">No active buses right now.</p></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
          <button id="favoriteBtn" class="btn btn-outline" style="width:auto;padding:8px 16px;"><i class="far fa-star"></i> <span data-i18n="favorite">Favorite</span></button>
          <button id="historyBtn" class="btn btn-outline" style="width:auto;padding:8px 16px;"><i class="fas fa-history"></i> <span data-i18n="history">History</span></button>
        </div>
      </div>
      <div id="routeDetailPanel" class="card route-detail hidden">
        <h3><i class="fas fa-route"></i> <span data-i18n="routeDetails">Route Details</span></h3>
        <div id="routeDetailContent"></div>
        <button id="btnCloseDetail" class="btn btn-secondary" style="width:auto;margin-top:10px;padding:8px 16px;"><i class="fas fa-times"></i> <span data-i18n="close">Close</span></button>
      </div>
    </section>

    <!-- FULL SCREEN BUS VIEW -->
    <div id="fullscreenBusView" class="fullscreen-overlay hidden">
      <div id="fullscreenMapContainer"></div>
      <div class="fullscreen-bottom-sheet">
        <div class="bus-info-header">
          <div>
            <h2 id="fsBusTitle">Bus 23</h2>
            <p id="fsBusRoute">Ligne 23 - Direction Aller</p>
            <p id="fsBusDriver">Driver: Ahmed</p>
          </div>
          <button id="closeFullscreenBus" class="btn btn-secondary" style="width:auto;padding:8px 16px;"><i class="fas fa-times"></i></button>
        </div>
        <div id="fsBusStops" class="fs-stops-list"></div>
      </div>
    </div>

    <!-- HISTORY PANEL -->
    <div id="historyPanel" class="history-panel hidden">
      <h3><i class="fas fa-history"></i> <span data-i18n="tripHistory">Trip History</span></h3>
      <div id="historyList"></div>
      <button id="btnCloseHistory" class="btn btn-secondary" style="width:auto;margin-top:12px;padding:8px 16px;"><i class="fas fa-times"></i> <span data-i18n="close">Close</span></button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Marker Cluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="js/firebase-config.js?v=7"></script>
  <script src="js/routes.js?v=7"></script>
  <script type="module" src="js/app.js?v=7"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ Service Worker registered'))
          .catch(err => console.warn('❌ SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
