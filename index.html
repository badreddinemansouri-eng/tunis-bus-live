<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tunis Bus Live</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-top">
                <h1><i class="fas fa-bus"></i> Tunis Bus Live</h1>
                <span id="connectionStatus" class="connection-badge">Connecting...</span>
            </div>
            <nav class="tabs">
                <button id="tabDriver" class="tab-btn active">
                    <i class="fas fa-steering-wheel"></i> I'm Driving
                </button>
                <button id="tabPassenger" class="tab-btn">
                    <i class="fas fa-person-waiting"></i> I'm Waiting
                </button>
            </nav>
        </header>

        <!-- Driver View -->
        <section id="driverView" class="view active">
            <div class="card driver-card">
                <h2><i class="fas fa-user"></i> Driver Panel</h2>
                <label for="driverName">Your Name (optional)</label>
                <input type="text" id="driverName" placeholder="e.g., Ahmed" autocomplete="name">
                
                <div class="two-col">
                    <div>
                        <label for="routeSelect">Select Route</label>
                        <select id="routeSelect" class="custom-select">
                            <option value="">-- Choose Route --</option>
                        </select>
                    </div>
                    <div>
                        <label for="directionSelect">Direction</label>
                        <select id="directionSelect" class="custom-select">
                            <option value="forward">Forward</option>
                            <option value="backward">Backward</option>
                        </select>
                    </div>
                </div>
                
                <button id="btnStartTrip" class="btn btn-primary btn-block">
                    <i class="fas fa-play"></i> Start Trip & Share Location
                </button>
                <button id="btnStopTrip" class="btn btn-danger btn-block hidden">
                    <i class="fas fa-stop"></i> Stop Trip
                </button>
                <div id="driverStatus" class="status-box"></div>
            </div>
        </section>

        <!-- Passenger View -->
        <section id="passengerView" class="view">
            <div class="card search-card">
                <h2><i class="fas fa-search"></i> Find Your Bus</h2>
                <div class="search-row">
                    <div class="search-input">
                        <i class="fas fa-filter"></i>
                        <select id="passengerRouteSelect" class="custom-select">
                            <option value="">-- All Buses --</option>
                        </select>
                    </div>
                    <button id="btnRefreshBuses" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
            <div id="map"></div>
            <div class="card bus-list-card">
                <h3><i class="fas fa-list"></i> Active Buses</h3>
                <ul id="busList"></ul>
                <div id="noBuses" class="empty-state">
                    <i class="fas fa-bus-simple"></i>
                    <p>No active buses right now.</p>
                </div>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/routes.json"></script>
    <script src="js/app.js"></script>
</body>
</html>
